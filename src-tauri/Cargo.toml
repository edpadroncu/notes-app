[package]
name = "notes-app"
version = "0.1.0"
description = "A notes app with Slack-style formatting and Obsidian import"
authors = ["edpadron"]
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "notes-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
dirs = "5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
